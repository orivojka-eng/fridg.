<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>FRIDGR — Choose a new password</title>
<link rel="stylesheet" href="/legal/site.css">
<style>
  form { display: grid; gap: 12px; margin-top: 18px; max-width: 420px; }
  input { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button { font: inherit; font-weight: 700; padding: 12px 16px; border-radius: 999px; border: 0; background: #14180F; color: #C6F24A; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; font-weight: 600; }
  .err { color: #C2410C; }
  .ok { color: #15803D; }
</style>
</head>
<body>
<header><a class="brand" href="/legal/support">FRIDGR</a></header>
<main>
  <h1>Choose a new password</h1>
  <p class="muted">After saving, go back to the app and log in with your new password. You will be signed out on your other devices.</p>
  <form id="f">
    <input id="p1" type="password" autocomplete="new-password" placeholder="New password (at least 6 characters)" minlength="6" maxlength="128" required>
    <input id="p2" type="password" autocomplete="new-password" placeholder="Repeat the new password" minlength="6" maxlength="128" required>
    <button id="b" type="submit">Save new password</button>
  </form>
  <p id="m" class="msg"></p>
</main>
<footer>© FRIDGR · <a href="/legal/privacy">Privacy</a> · <a href="/legal/support">Support</a></footer>
<script src="/legal/reset-password.js"></script>
</body>
</html>
